name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ─── Web Quality Gates (always runs) ─────────────────────────────────────────

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test:unit

      - name: Build
        run: pnpm build

      - name: i18n key check (if i18n enabled)
        run: |
          if [ -f "packages/i18n/locales/en/common.json" ]; then
            pnpm i18n:check
          else
            echo "i18n not enabled, skipping"
          fi

      - name: i18n bundle size check (if i18n enabled)
        run: |
          if [ -f "packages/i18n/locales/en/common.json" ]; then
            pnpm i18n:bundle-size
          else
            echo "i18n not enabled, skipping"
          fi

      - name: Security audit
        run: pnpm audit --audit-level=high

      - name: Check for leaked secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD

  # ─── Cross-Browser E2E (web variants) ────────────────────────────────────

  e2e-cross-browser:
    name: E2E (${{ matrix.browser }})
    runs-on: ubuntu-latest
    needs: quality
    # Only run when Playwright tests exist
    if: hashFiles('playwright.config.ts') != ''
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}

      - name: Run E2E tests
        run: pnpm exec playwright test --project=${{ matrix.browser }}
        env:
          TEST_BASE_URL: http://localhost:3000

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/

